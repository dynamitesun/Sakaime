name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Sakaime.apk
      - uses: actions/upload-artifact@v4
        with: { name: Sakaime-apk, path: Sakaime.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sakaime (latest build)
          body: Download Sakaime.apk on your phone and open it to install or update.
          files: Sakaime.apk
          make_latest: true
