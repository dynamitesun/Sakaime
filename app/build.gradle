plugins { id 'com.android.application' }
android {
    namespace 'com.dynamitesun.sakaime'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dynamitesun.sakaime'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        fixed {
            storeFile file('sakaime.keystore')
            storePassword 'sakaime'
            keyAlias 'sakaime'
            keyPassword 'sakaime'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'mp3' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
